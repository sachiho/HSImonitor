<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="390" rx="14" fill="#0f172a"/>
  <text x="480" y="30" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">HSImonitor Hardware Wiring Diagram (T568B Ethernet Cable + Inverter 5V Direct Power)</text>

  <!-- Left Box: ESP32 Lolin32 OLED -->
  <rect x="28" y="54" width="260" height="295" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="158" y="80" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">ESP32 (Lolin32 OLED)</text>
  <rect x="48" y="92" width="220" height="42" rx="6" fill="#020617" stroke="#475569"/>
  <text x="158" y="110" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Built-in 0.96" OLED (SSD1306)</text>
  <text x="158" y="126" text-anchor="middle" fill="#94a3b8" font-size="10">I2C 0x3C: SDA=GPIO5, SCL=GPIO4</text>

  <!-- ESP32 Pins -->
  <g font-family="Consolas, monospace" font-size="12" font-weight="600">
    <text x="273" y="164" text-anchor="end" fill="#fb923c">5V (VIN)</text>
    <circle cx="288" cy="160" r="5" fill="#fb923c"/>

    <text x="273" y="198" text-anchor="end" fill="#94a3b8">GND</text>
    <circle cx="288" cy="194" r="5" fill="#94a3b8"/>

    <text x="273" y="234" text-anchor="end" fill="#f87171">3.3V</text>
    <circle cx="288" cy="230" r="5" fill="#f87171"/>

    <text x="273" y="272" text-anchor="end" fill="#fbbf24">GPIO 25 (RX2)</text>
    <circle cx="288" cy="268" r="5" fill="#fbbf24"/>

    <text x="273" y="308" text-anchor="end" fill="#38bdf8">GPIO 26 (TX2)</text>
    <circle cx="288" cy="304" r="5" fill="#38bdf8"/>
  </g>
  <text x="158" y="336" text-anchor="middle" fill="#64748b" font-size="10">Powered directly by HSI3000U 5V</text>

  <!-- Center Box: RS485 Auto-Direction Module -->
  <rect x="375" y="182" width="215" height="167" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="482" y="205" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700">RS485 Module (3.3V)</text>
  <text x="482" y="219" text-anchor="middle" fill="#94a3b8" font-size="10">Auto-Direction (No DE/RE pin)</text>

  <g font-family="Consolas, monospace" font-size="12" font-weight="600">
    <!-- Left pins -->
    <circle cx="375" cy="230" r="5" fill="#f87171"/>
    <text x="389" y="234" fill="#f87171">VCC (3.3V)</text>

    <circle cx="375" cy="252" r="5" fill="#94a3b8"/>
    <text x="389" y="256" fill="#94a3b8">GND</text>

    <circle cx="375" cy="280" r="5" fill="#fbbf24"/>
    <text x="389" y="284" fill="#fbbf24">RXD (RO)</text>

    <circle cx="375" cy="308" r="5" fill="#38bdf8"/>
    <text x="389" y="312" fill="#38bdf8">TXD (DI)</text>

    <!-- Right pins -->
    <text x="576" y="264" text-anchor="end" fill="#34d399">A (+)</text>
    <circle cx="590" cy="260" r="5" fill="#34d399"/>

    <text x="576" y="302" text-anchor="end" fill="#c084fc">B (-)</text>
    <circle cx="590" cy="298" r="5" fill="#c084fc"/>
  </g>

  <!-- Right Box: LVYUAN HSI3000U RJ45 -->
  <rect x="665" y="110" width="265" height="239" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="797" y="135" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="700">LVYUAN HSI3000U (RJ45)</text>
  <text x="797" y="151" text-anchor="middle" fill="#94a3b8" font-size="10">T568B Ethernet Cable (9600bps, 8N1)</text>

  <g font-family="Consolas, monospace" font-size="11.5" font-weight="600">
    <circle cx="665" cy="160" r="5" fill="#fb923c"/>
    <text x="678" y="164" fill="#fb923c">Pin 1 [W/Orange]: +5V Out</text>

    <circle cx="665" cy="194" r="5" fill="#94a3b8"/>
    <text x="678" y="198" fill="#94a3b8">Pin 2 [Orange]:   GND</text>

    <circle cx="665" cy="260" r="5" fill="#34d399"/>
    <text x="678" y="264" fill="#34d399">Pin 7 [W/Brown]:  RS485 A(+)</text>

    <circle cx="665" cy="298" r="5" fill="#c084fc"/>
    <text x="678" y="302" fill="#c084fc">Pin 8 [Brown]:    RS485 B(-)</text>
  </g>
  <text x="797" y="332" text-anchor="middle" fill="#64748b" font-size="10">Slave ID: 1 | Pins 3-6: Unused</text>

  <!-- Direct 5V & GND Wires from HSI3000U RJ45 to ESP32 -->
  <line x1="293" y1="160" x2="660" y2="160" stroke="#fb923c" stroke-width="2.8"/>
  <text x="482" y="153" text-anchor="middle" fill="#fb923c" font-size="10" font-weight="600">+5V Direct Power (Pin 1: White/Orange)</text>

  <line x1="293" y1="194" x2="660" y2="194" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Tap GND down to RS485 Module GND -->
  <circle cx="335" cy="194" r="4" fill="#94a3b8"/>
  <polyline points="335,194 335,252 370,252" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <!-- ESP32 <-> RS485 Module -->
  <line x1="293" y1="230" x2="370" y2="230" stroke="#f87171" stroke-width="2.5"/>
  <polyline points="293,268 352,268 352,280 370,280" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
  <polyline points="293,304 352,304 352,308 370,308" fill="none" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- RS485 Module <-> HSI3000U RJ45 -->
  <line x1="595" y1="260" x2="660" y2="260" stroke="#34d399" stroke-width="3"/>
  <line x1="595" y1="298" x2="660" y2="298" stroke="#c084fc" stroke-width="3"/>

  <!-- Footer Caution -->
  <text x="480" y="374" text-anchor="middle" fill="#fbbf24" font-size="11">Note: Always verify +5V (Pin 1) and GND (Pin 2) polarity with a multimeter before connecting if cable standard (T568B vs T568A) is unknown.</text>
</svg>
